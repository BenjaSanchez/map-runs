[start-settings]
starting-latitude = 55.760274
starting-longitude = 12.541296
starting-zoom = 12

[layout-settings]
terrain = https://basemap.queeniemella.cc/tiles/countries/{z}/{x}/{y}.png
terrain-attribution = © <a href="https://queeniemella.cc">queeniemella</a> | © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors
run-color = #b80f0a
run-opacity = 0.5
run-weight = 3
highlight-color = #ffc30b
highlight-opacity = 1
highlight-weight = 5

[misc-settings]
data-path = ./gps-data
output-path = ./output-map.html
verbose = True
